name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # يجهّز مجلد www تلقائيًا سواء الملفات مرفوعة داخل www/ أو في الجذر مباشرة
      - name: Prepare web files
        run: |
          mkdir -p www
          for f in index.html native-bridge.js manifest.json sw.js icon-192-3.png logo-dark.png logo-light.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html || (echo "index.html not found" && exit 1)
          test -f www/native-bridge.js || (echo "native-bridge.js not found" && exit 1)

      - run: npm install
      - run: npx cap add android

      - name: Permissions (camera + notifications)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M

      - name: App icon
        run: |
          SRC=""
          for f in icon.png app-icon.png icon-192-3.png; do if [ -f "$f" ]; then SRC="$f"; break; fi; done
          if [ -n "$SRC" ]; then
            R=android/app/src/main/res
            rm -rf $R/mipmap-anydpi-v26
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              mkdir -p $R/mipmap-$d
              for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
                convert "$SRC" -resize ${s}x${s} $R/mipmap-$d/$n.png
              done
            done
          fi

      - name: Notification small icon (optional)
        run: |
          if [ -f ic_stat_onesignal_default.png ]; then
            R=android/app/src/main/res
            for pair in mdpi:24 hdpi:36 xhdpi:48 xxhdpi:72 xxxhdpi:96; do
              d=${pair%%:*}; s=${pair##*:}
              mkdir -p $R/drawable-$d
              convert ic_stat_onesignal_default.png -resize ${s}x${s} $R/drawable-$d/ic_stat_onesignal_default.png
            done
          fi

      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mr-alfaham.apk
      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: عالفحم MR - آخر إصدار
          files: mr-alfaham.apk
